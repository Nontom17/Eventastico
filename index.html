<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventastico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 class="logo">

            EVENT <span class="punto-rojo">•</span>ASTICO
            
        </h1>

        <nav>
            <a href="">Inicio</a>

            <a href="">¿Comó Funciona?</a>

            <a href="">Ayuda</a>

        </nav>

        <div class="botones-header">

            <button class="btn-registro">Registro</button>

            <button class="btn-crear">Crear Evento</button>

        </div>

        <section class="zona-mapa">

            <img src="Imágenes/mapa-1.png" alt="mapa-1">

        </section>

        <section class="filtros">

            <div class="pestanas">

                <button>Eventos cercanos</button>

                <button>Nuevos Eventos</button>

            </div>

            <div class="buscador">

                <input type="text" id="busqueda" placeholder="Buscar Eventos">

                <button>Buscar</button>

            </div>

            <div class="ordenar">

                <select>

                    <option>Ordenar por Relevancia</option>

                </select>

            </div>

        </section>
    </header>


</body>

</html>
