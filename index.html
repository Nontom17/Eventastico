<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventastico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 class="logo">

            EVENT <span class="punto-rojo">•</span>ASTICO

        </h1>

        <nav>
            <a href="">
                <h2>Inicio</h2>
            </a>

            <a href="">
                <h2>¿Comó Funciona?</h2>
            </a>

            <a href="">
                <h2>Ayuda</h2>
            </a>

        </nav>

    </header>

    <div class="botones-header">

        <button class="btn-registro">Registro</button>

        <button class="btn-crear">Crear Evento</button>

    </div>

    <section class="zona-mapa">

        <img id="mapa" src="Imágenes/mapa-1.png" alt="mapa-1">

    </section>

    <section class="filtros">

        <div class="pestanas">

            <button>Eventos cercanos</button>

            <button>Nuevos Eventos</button>

        </div>

        <div class="buscador">

            <input type="text" id="busqueda" placeholder="Buscar Eventos">

            <button>Buscar</button>

        </div>

        <div class="ordenar">

            <select>

                <option>Ordenar por Relevancia</option>

            </select>

        </div>

    </section>

    <!--EVENTOS-->

    <main class="contendor-de-eventos">

        <!--EVENTO 1-->

        <article class="tarjeta">

            <div class="imagen-tarjeta">

                <img src="Imágenes/evento-tecnologia.jpg" alt="evento-1">

            </div>

            <div class="info-tarjeta">

                <div class="fecha-caja">

                    <span class="dia">10</span>

                    <span class="mes">may</span>

                </div>

                <div class="detalles-evento">

                    <h2>Congreso de Tecnología</h2>

                    <p class="asistentes-evento">Asistentes:

                    <img src="Imágenes/asistentes.png" alt="asistentes">

                    <span id="asistentes">5</span>

                    </p>

                </div>


            </div>

            <!--EVENTO 2-->

            <article class="tarjeta">

            <div class="imagen-tarjeta">

                <img src="Imágenes/evento-verano.jpg" alt="evento-2">

            </div>

            <div class="info-tarjeta">

                <div class="fecha-caja">

                    <span class="dia">15</span>

                    <span class="mes">jul</span>

                </div>

                <div class="detalles-evento">

                    <h2>Fiesta de verano</h2>

                    <p class="asistentes-evento">Asistentes:

                    <img src="Imágenes/asistentes.png" alt="asistentes">

                    <span id="asistentes2">4</span>

                    </p>

                </div>

            </div>

            <!--EVENTO 3-->

            <article class="tarjeta">

            <div class="imagen-tarjeta">

                <img src="Imágenes/evento-navidad.jpg" alt="evento-3">

            </div>

            <div class="info-tarjeta">

                <div class="fecha-caja">

                    <span class="dia">18</span>

                    <span class="mes">dic</span>

                </div>

                <div class="detalles-evento">

                    <h2>Posada Navideña</h2>

                    <p class="asistentes-evento">Asistentes:

                    <img src="Imágenes/asistentes.png" alt="asistentes">

                    <span id="asistentes3">10</span>

                    </p>

                </div>

            </div>

        </article>

    </main>


</body>

</html>
